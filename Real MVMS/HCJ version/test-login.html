<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Test - MVMS</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>MVMS Login Test</h1>

    <div id="testResults"></div>

    <button onclick="testRoleSelection()">Test Role Selection</button>
    <button onclick="testFormValidation()">Test Form Validation</button>
    <button onclick="testDemoCredentials()">Test Demo Credentials</button>

    <script>
        function addResult(message, isSuccess = true) {
            const results = document.getElementById('testResults');
            const div = document.createElement('div');
            div.className = `test-result ${isSuccess ? 'success' : 'error'}`;
            div.textContent = message;
            results.appendChild(div);
        }

        function testRoleSelection() {
            // Simulate role selection
            const vendorRole = { role: 'vendor', email: 'vendor@mbararamarket.ug', password: 'Vendor@123' };
            const adminRole = { role: 'admin', email: 'admin@mbararamarket.ug', password: 'Admin@123' };

            addResult('✓ Role selection logic working - Vendor role: ' + JSON.stringify(vendorRole));
            addResult('✓ Role selection logic working - Admin role: ' + JSON.stringify(adminRole));
        }

        function testFormValidation() {
            // Test email validation
            const validEmail = 'test@example.com';
            const invalidEmail = 'invalid-email';

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (emailRegex.test(validEmail)) {
                addResult('✓ Email validation working - Valid email accepted');
            } else {
                addResult('✗ Email validation failed - Valid email rejected', false);
            }

            if (!emailRegex.test(invalidEmail)) {
                addResult('✓ Email validation working - Invalid email rejected');
            } else {
                addResult('✗ Email validation failed - Invalid email accepted', false);
            }

            // Test password requirements
            const validPassword = 'Test@123';
            if (validPassword.length >= 6) {
                addResult('✓ Password validation working - Valid password accepted');
            } else {
                addResult('✗ Password validation failed', false);
            }
        }

        function testDemoCredentials() {
            const demoCredentials = {
                admin: { email: 'admin@mbararamarket.ug', password: 'Admin@123' },
                vendor: { email: 'vendor@mbararamarket.ug', password: 'Vendor@123' }
            };

            addResult('✓ Demo credentials loaded - Admin: ' + demoCredentials.admin.email + ' / ' + demoCredentials.admin.password);
            addResult('✓ Demo credentials loaded - Vendor: ' + demoCredentials.vendor.email + ' / ' + demoCredentials.vendor.password);
        }

        // Run all tests on page load
        window.onload = function() {
            addResult('🚀 Starting MVMS Login Tests...');
            testRoleSelection();
            testFormValidation();
            testDemoCredentials();
            addResult('✅ All tests completed!');
        };
    </script>
</body>
</html>
